<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teste - API FakeStore</title>
    <link rel="stylesheet" href="style.css" />
    <script src="./main.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Bem-vindo à nossa loja</h1>
      <p>Encontre os melhores produtos com os melhores preços!</p>
    </header>

    <main>
      <section id="products">
        <h2>Produtos em destaque</h2>
        <div id="product-list">
          <article class="product-card">
            <img src="https://picsum.photos/200" alt="Produto 1" />
            <h3>Produto 1</h3>
            <p class="product-description">Descrição do produto 1.</p>
            <p class="product-price">R$ 100.00</p>
            <button class="add-to-cart">Adicionar ao Carrinho</button>
          </article>

          <article class="product-card">
            <img src="https://picsum.photos/200" alt="Produto 2" />
            <h3>Produto 2</h3>
            <p class="product-description">Descrição do produto 2.</p>
            <p class="product-price">R$ 200.00</p>
            <button class="add-to-cart">Adicionar ao Carrinho</button>
          </article>
        </div>
      </section>

      <section id="cart">
        <h2>Carrinho de Compras</h2>
        <div id="cart-items"></div>
        <p>Total: R$ <span id="cart-total">0.00</span></p>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Teste - API FakeStore. Todos os direitos reservados.</p>
    </footer>
  </body>
</html>
